<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rutinas de gimnasio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('rutinas.ver_semana') }}">🏋️ Rutinas de gimnasio</a>
    <nav class="nav">
      <a href="{{ url_for('rutinas.ver_semana') }}">Semana</a>
      <a href="{{ url_for('progreso.ver_progreso') }}">Progreso</a>
      <a href="{{ url_for('comidas.ver_comidas') }}">Comidas</a>
      <a href="{{ url_for('suscripcion.ver_suscripcion') }}">Suscripción</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
